<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Đăng nhập - Demo App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f4f6;
    }

    .login-container {
      width: 400px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }

    .login-container h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #222;
    }

    .login-container p {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d99000;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .register-link {
      margin-top: 20px;
      text-align: center;
    }

    .register-link a {
      color: #d99000;
      text-decoration: none;
      font-weight: bold;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
    
  </style>
</head>

<body>

  <div class="login-container">

    <h1>Đăng nhập</h1>

    <p>Đăng nhập vào tài khoản của bạn</p>

    <form id="loginForm">

      <div class="form-group">
        <label for="username">Tên đăng nhập</label>

        <input
          type="text"
          id="username"
          placeholder="Nhập username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>

        <input
          type="password"
          id="password"
          placeholder="Nhập mật khẩu"
          required
        >
      </div> 
      <a
  href="/forgot-password.html"
  style="
    display:block;
    margin-top:12px;
    text-align:center;
    color:#d99000;
    text-decoration:none;
    font-weight:600;
  "
>
  Quên mật khẩu?
</a>

      <button type="submit">
        Đăng nhập
      </button>

    </form>

    <div id="message"></div>

    <div class="register-link">
      Chưa có tài khoản?
      <a href="/register.html">Đăng ký ngay</a>
    </div>

  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const message = document.getElementById('message');

    loginForm.addEventListener('submit', async function (event) {

      event.preventDefault();

      const username =
        document.getElementById('username').value.trim();

      const password =
        document.getElementById('password').value;

      message.textContent = 'Đang đăng nhập...';
      message.style.color = '#333';

      try {

        const response = await fetch('/auth/login', {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message || 'Đăng nhập thất bại'
          );
        }

        // Lưu JWT
        localStorage.setItem(
          'access_token',
          data.access_token
        );

        // Lưu thông tin user
        localStorage.setItem(
          'user',
          JSON.stringify(data.user)
        );

        message.textContent =
          'Đăng nhập thành công!';

        message.style.color = 'green';

        // Chuyển sang trang sản phẩm
        setTimeout(() => {
          window.location.href = '/products.html';
        }, 800);

      } catch (error) {

        console.error(error);

        message.textContent =
          error.message || 'Có lỗi xảy ra';

        message.style.color = 'red';
      }

    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quên mật khẩu - RaoVat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 100%;
      max-width: 430px;

      background: #fff;

      padding: 30px;

      border-radius: 16px;

      box-shadow: 0 8px 30px rgba(0, 0, 0, .1);
    }

    .logo {
      text-align: center;

      font-size: 28px;
      font-weight: 800;

      margin-bottom: 8px;
    }

    .logo b {
      color: #ffba00;
    }

    h1 {
      text-align: center;

      font-size: 24px;

      margin: 0 0 8px;
    }

    .sub {
      text-align: center;

      color: #777;

      margin-bottom: 25px;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    label {
      display: block;

      font-weight: 600;

      margin-bottom: 6px;
    }

    .group {
      margin-bottom: 16px;
    }

    input {
      width: 100%;

      padding: 12px 14px;

      border: 1px solid #ddd;

      border-radius: 8px;

      font-size: 15px;

      outline: none;
    }

    input:focus {
      border-color: #ffba00;
    }

    button {
      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 8px;

      background: #ffba00;

      color: #222;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      background: #f2aa00;
    }

    button:disabled {
      opacity: .6;

      cursor: not-allowed;
    }

    .message {
      min-height: 22px;

      margin-top: 15px;

      text-align: center;

      font-size: 14px;
    }

    .error {
      color: #e5252a;
    }

    .success {
      color: #168a3b;
    }

    .back {
      margin-top: 20px;

      text-align: center;
    }

    .back a {
      color: #d99000;

      text-decoration: none;

      font-weight: 600;
    }

    .otp-note {
      text-align: center;

      color: #777;

      font-size: 14px;

      margin-bottom: 15px;
    }

    @media (max-width: 500px) {
      .box {
        margin: 15px;

        padding: 22px;
      }
    }
  </style>

</head>

<body>

  <div class="box">

    <div class="logo">
      RAO<b>VAT</b>
    </div>


    <!-- =========================
         BƯỚC 1: NHẬP EMAIL
    ========================== -->

    <div class="step active" id="stepEmail">

      <h1>Quên mật khẩu?</h1>

      <p class="sub">
        Nhập email để nhận mã OTP
      </p>


      <div class="group">

        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="Nhập email tài khoản"
          required
        >

      </div>


      <button id="btnSendOtp">
        Gửi mã OTP
      </button>

    </div>


    <!-- =========================
         BƯỚC 2: NHẬP OTP
    ========================== -->

    <div class="step" id="stepOtp">

      <h1>Nhập mã OTP</h1>

      <p class="otp-note">
        Mã OTP đã được gửi tới email của bạn.
        <br>
        Mã có hiệu lực trong 5 phút.
      </p>


      <div class="group">

        <label>Mã OTP</label>

        <input
          type="text"
          id="otp"
          maxlength="6"
          placeholder="Nhập 6 số OTP"
        >

      </div>


      <button id="btnVerifyOtp">
        Xác nhận OTP
      </button>

    </div>


    <!-- =========================
         BƯỚC 3: MẬT KHẨU MỚI
    ========================== -->

    <div class="step" id="stepPassword">

      <h1>Đặt mật khẩu mới</h1>

      <p class="sub">
        Tạo mật khẩu mới cho tài khoản
      </p>


      <div class="group">

        <label>Mật khẩu mới</label>

        <input
          type="password"
          id="newPassword"
          placeholder="Nhập mật khẩu mới"
        >

      </div>


      <div class="group">

        <label>Nhập lại mật khẩu</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Nhập lại mật khẩu"
        >

      </div>


      <button id="btnResetPassword">
        Đặt lại mật khẩu
      </button>

    </div>


    <!-- THÔNG BÁO -->

    <div
      id="message"
      class="message">
    </div>


    <div class="back">

      <a href="/login.html">
        ← Quay lại đăng nhập
      </a>

    </div>

  </div>


  <script>

    // =========================
    // BIẾN
    // =========================

    let email = '';
    let otp = '';


    const message =
      document.getElementById('message');


    // =========================
    // HIỆN BƯỚC
    // =========================

    function showStep(stepId) {

      document
        .querySelectorAll('.step')
        .forEach(step => {
          step.classList.remove('active');
        });

      document
        .getElementById(stepId)
        .classList.add('active');

    }


    // =========================
    // THÔNG BÁO
    // =========================

    function showMessage(text, type = '') {

      message.textContent = text;

      message.className =
        'message ' + type;

    }


    // =========================
    // BƯỚC 1
    // GỬI OTP
    // =========================

    document
      .getElementById('btnSendOtp')
      .addEventListener('click', async function () {

        email =
          document
            .getElementById('email')
            .value
            .trim();


        if (!email) {

          showMessage(
            'Vui lòng nhập email.',
            'error'
          );

          return;
        }


        const button = this;

        button.disabled = true;

        showMessage(
          'Đang gửi mã OTP...'
        );


        try {

          const response =
            await fetch('/auth/forgot-password', {

              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body: JSON.stringify({
                email
              })

            });


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              Array.isArray(data.message)
                ? data.message.join(', ')
                : data.message ||
                  'Không thể gửi OTP'
            );

          }


          showMessage(
            'Đã gửi OTP. Kiểm tra email của bạn.',
            'success'
          );


          showStep('stepOtp');


          document
            .getElementById('otp')
            .focus();


        } catch (error) {

          showMessage(
            error.message,
            'error'
          );

        } finally {

          button.disabled = false;

        }

      });


    // =========================
    // BƯỚC 2
    // XÁC NHẬN OTP
    // =========================

    document
      .getElementById('btnVerifyOtp')
      .addEventListener('click', async function () {

        otp =
          document
            .getElementById('otp')
            .value
            .trim();


        if (!/^\d{6}$/.test(otp)) {

          showMessage(
            'OTP phải gồm 6 chữ số.',
            'error'
          );

          return;
        }


        const button = this;

        button.disabled = true;

        showMessage(
          'Đang kiểm tra OTP...'
        );


        try {

          const response =
            await fetch('/auth/verify-otp', {

              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body: JSON.stringify({
                email,
                otp
              })

            });


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              Array.isArray(data.message)
                ? data.message.join(', ')
                : data.message ||
                  'OTP không đúng'
            );

          }


          showMessage(
            'OTP chính xác.',
            'success'
          );


          showStep('stepPassword');


          document
            .getElementById('newPassword')
            .focus();


        } catch (error) {

          showMessage(
            error.message,
            'error'
          );

        } finally {

          button.disabled = false;

        }

      });


    // =========================
    // BƯỚC 3
    // ĐẶT LẠI MẬT KHẨU
    // =========================

    document
      .getElementById('btnResetPassword')
      .addEventListener('click', async function () {

        const newPassword =
          document
            .getElementById('newPassword')
            .value;


        const confirmPassword =
          document
            .getElementById('confirmPassword')
            .value;


        if (newPassword.length < 6) {

          showMessage(
            'Mật khẩu phải có ít nhất 6 ký tự.',
            'error'
          );

          return;
        }


        if (newPassword !== confirmPassword) {

          showMessage(
            'Mật khẩu nhập lại không giống nhau.',
            'error'
          );

          return;
        }


        const button = this;

        button.disabled = true;

        showMessage(
          'Đang đặt lại mật khẩu...'
        );


        try {

          const response =
            await fetch('/auth/reset-password', {

              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body: JSON.stringify({

                email,
                otp,
                newPassword

              })

            });


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              Array.isArray(data.message)
                ? data.message.join(', ')
                : data.message ||
                  'Không thể đặt lại mật khẩu'
            );

          }


          showMessage(
            'Đặt lại mật khẩu thành công! Đang chuyển đến đăng nhập...',
            'success'
          );


          setTimeout(() => {

            location.href =
              '/login.html';

          }, 1800);


        } catch (error) {

          showMessage(
            error.message,
            'error'
          );

          button.disabled = false;

        }

      });

  </script>

</body>

</html>
